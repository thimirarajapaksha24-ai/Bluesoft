  <title>Bluesoft AI</title>

  <link 
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" 
    rel="stylesheet">
  <style>
        .canva-text{
            background: linear-gradient(45deg, #ffe4fc, #ffe9cd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body { 
            font-family: 'DM Sans', sans-serif; 
            overflow: hidden; 
            height: calc(
                100 * min(
                    var(--vh, 1vh), 1vh
                    )
                ); 
        }

        .bg-animated {
            position: fixed; 
            inset: 0; 
            z-index: 0;
            background: linear-gradient(
                135deg, 
                #1a0533, 
                #6b21a8,
                #db2777, 
                #f97316, 
                #1a0533
                );
            background-size: 400% 400%;
            animation: gradientMove 20s ease infinite;
        }
        @keyframes gradientMove {
            0% { 
                background-position: 0% 50%; 
            }
            50% { 
                background-position: 100% 50%; 
            }
            100% { 
                background-position: 0% 50%; 
            }
        }

        #snow-canvas { 
            position: fixed; 
            inset: 0; 
            z-index: 1; 
            pointer-events: none; 
        }

        .app-shell { 
            position: relative; 
            z-index: 2; 
            height: calc(
                100 * min(
                    var(--vh, 1vh), 1vh
                    )
                ); display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            transition: justify-content 0.6s; 
        }
        .app-shell.chat-active { 
            justify-content: flex-end; 
        }

        /* Landing greeting */
        .greeting {
            text-align: center; 
            margin-bottom: 32px;
            transition: opacity 0.5s, transform 0.5s;
        }
        .app-shell.chat-active .greeting { 
            opacity: 0; 
            transform: translateY(-30px); 
            pointer-events: none; 
            position: absolute; 
        }

        /* Input bar */
        .input-bar {
            width: min(92vw, 600px);
            padding: 6px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 28px;
            display: flex; 
            align-items: center; 
            gap: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: all 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .app-shell.chat-active .input-bar {
            border-radius: 24px; 
            margin-bottom: 16px; 
            width: min(95vw, 640px);
        }
        .input-bar input {
            flex: 1; 
            padding: 14px 20px; 
            border: none; 
            background: transparent;
            color: #fff; 
            font-size: 16px; 
            outline: none;
        }
        .input-bar input::placeholder { 
            color: rgba(255,255,255,0.45); 
        }
        .input-bar button {
            padding: 12px 24px; 
            border: none; 
            border-radius: 22px; 
            cursor: pointer;
            background: linear-gradient(135deg, #a855f7, #f97316); 
            color: #fff; 
            font-weight: 600; 
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .input-bar button:hover { 
            transform: scale(1.05); 
            box-shadow: 0 4px 20px rgba(168,85,247,0.5); 
        }

        /* Chat feed */
        .chat-feed {
            flex: 1; 
            width: min(95vw, 640px); 
            overflow-y: auto; 
            padding: 20px 16px;
            display: none; 
            flex-direction: column; 
            gap: 12px; 
            scroll-behavior: smooth;
        }
        .chat-feed::-webkit-scrollbar { width: 4px; }
        .chat-feed::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.2); 
            border-radius: 2px; 
        }
        .app-shell.chat-active .chat-feed { display: flex; }

        .msg { 
            max-width: 78%; 
            padding: 12px 18px; 
            border-radius: 20px; 
            word-wrap: break-word; 
            animation: popIn 0.35s cubic-bezier(0.68,-0.55,0.27,1.55); 
            line-height: 1.5; 
        }
        @keyframes popIn { 
            from { 
                transform: scale(0.4); 
                opacity: 0; 
            } 
            to { 
                transform: scale(1); 
                opacity: 1; 
            } 
        }
        .msg-user { 
            align-self: flex-end; 
            background: rgba(255,255,255,0.15); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: #fff; 
        }
        .msg-ai { 
            align-self: flex-start; 
            background: rgba(30,10,60,0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.12); 
            color: #f0e6ff; 
        }

        .typing { 
            display: none; 
            align-self: flex-start; 
            padding: 12px 18px; 
            border-radius: 20px; 
            background: rgba(30,10,60,0.6); 
            border: 1px solid rgba(255,255,255,0.12); 
            gap: 5px; 
            align-items: center; 
        }
        .typing.active { display: flex; }
        .typing span { 
            width: 7px;
            height: 7px; 
            border-radius: 50%; 
            background: #d8b4fe; 
            animation: bounce 1.2s infinite; 
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 
            0%,60%,100% { 
                transform: translateY(0); 
            } 
            30% { 
                transform: translateY(-7px); 
            } 
        }
        ul{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            margin: 0;
            padding: 0;
        }
        ul li{
            list-style: none;
            margin: 0 5px;
        }
        ul li a .fa{
            font-size: 40px;
            color: #262626;
            line-height: 80px;
            transition: 0.5s;
            padding-right: 14px;
        }
        ul li a span{
            padding: 0;
            margin: 0;
            position: absolute;
            top: 30px;
            color: #262626;
            letter-spacing: 4px;
            transition: 0.5s;
        }
        ul li a{
            text-decoration: none;
            display: absolute;
            display: block;
            width: 210px;
            height: 80px;
            background: #fff;
            text-align: left;
            padding-left: 20px;
            transform: rotate(-30deg) skew(25deg) translate(0,0);
            box-shadow: -20px 20px 10px rgba(0,0,0,0.5);
        }
        ul li a:before{
            content: ' ';
            position: absolute;
            top: 10px;
            left: -20px;
            height: 100%;
            width: 20px;
            background: #b1b1b1;
            transform: 0.5s;
            transform: rotate(0deg) skewY(-45deg);
        }
        ul li a:after{
            content: ' ';
            position: absolute;
            bottom: -20px;
            left: -10px;
            height: 20px;
            width: 100%;
            background: #b1b1b1;
            transform: 0.5s;
            transform: rotate(0deg) skewX(-45deg);
        }
        ul li a:hover{
            transform: rotate(-30deg) skew(25deg) translate(20px,-15px);
            box-shadow: -50px 50px 50px rgba(0,0,0,0.5);
        }
        ul li:hover .fa{
            color: #fff;
        }
        ul li:hover span{
            color: #fff;
        }
        /*child 1*/
        ul li:hover:nth-child(1) a{
            background: #3b5998;
        }
        ul li:hover:nth-child(1) a:before{
            background: #365492;
        }
        ul li:hover:nth-child(1) a:after{
            background: #4a69ad;
        }
        /*child 1*/

        /*child 2*/
        ul li:hover:nth-child(2) a{
            background: #00aced;
        }
        ul li:hover:nth-child(2) a:before{
            background: #097aa5;
        }
        ul li:hover:nth-child(2) a:after{
            background: #53b9e0;
        }
        /*child 2*/

        /*child 3*/
        ul li:hover:nth-child(3) a{
            background: #dd4b39;
        }
        ul li:hover:nth-child(3) a:before{
            background: #b33a2b;
        }
        ul li:hover:nth-child(3) a:after{
            background: #e66a5a;
        }
        /*child 3*/

        /*child 4*/
        ul li:hover:nth-child(4) a{
            background: #e4405f;
        }
        ul li:hover:nth-child(4) a:before{
            background: #d81c3f;
        }
        ul li:hover:nth-child(4) a:after{
            background: #e46880;
        }
        /*child 4*/
    </style>
 </head>

<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function() {
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatFeed = document.getElementById('chat-feed');
    const typingIndicator = document.getElementById('typing');
    const appShell = document.getElementById('app-shell');

    if (chatForm && chatInput) {
        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const message = chatInput.value.trim();
            if (!message) return;

            // 1. සෙවුම් බාර් එක පහළට යන ඇනිමේෂන් එක ක්‍රියාත්මක කිරීම
            if (appShell) appShell.classList.add('chat-active');

            // 2. ළමයාගේ ප්‍රශ්නය පෙන්වීම
            appendMessage(message, 'msg-user');
            chatInput.value = '';

            // 3. ටයිපිං ඇනිමේෂන් එක (තිත් තුන) පෙන්වීම
            if (typingIndicator) {
                typingIndicator.classList.add('active');
                chatFeed.appendChild(typingIndicator);
            }
            chatFeed.scrollTop = chatFeed.scrollHeight;

            try {
                // 4. කිසිදු කී එකක් අවශ්‍ය නොවන නිදහස් AI සර්වර් එකකට සම්බන්ධ වීම
                const response = await fetch("https://pollinations.ai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        messages: [
                            { role: "system", content: "You are a friendly advanced educational AI assistant. Explain complex educational concepts simply. Always prioritize responding in beautiful Sinhala language, but use English if the user asks in English." },
                            { role: "user", content: message }
                        ]
                    })
                });

                const aiResponseText = await response.text();

                // ටයිපිං ඇනිමේෂන් එක නතර කිරීම
                if (typingIndicator) typingIndicator.classList.remove('active');

                // 5. AI පිළිතුර ඔයාගේ msg-ai කොටුව ඇතුළේ පෙන්වීම
                appendMessage(aiResponseText, 'msg-ai');

            } catch (error) {
                if (typingIndicator) typingIndicator.classList.remove('active');
                appendMessage("Sorry Server error , please check Talk to AI button to use AI Free ", 'msg-ai');
                console.error("AI Error:", error);
            }
        });
    }

    function appendMessage(text, className) {
        if (!chatFeed) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${className}`;
        msgDiv.innerText = text;
        if (typingIndicator) chatFeed.insertBefore(msgDiv, typingIndicator);
        else chatFeed.appendChild(msgDiv);
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }
});
</script>

  <script>
        // Snow particles
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];
        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        resize(); 
        window.addEventListener('resize', resize);
        for (let i = 0; i < 90; i++) 
        flakes.push(
                        { 
                            x: Math.random()*canvas.width, 
                            y: Math.random()*canvas.height, 
                            r: Math.random()*2.5+1, 
                            dx: Math.random()*0.4-0.2, 
                            dy: Math.random()*0.8+0.4, 
                            o: Math.random()*0.5+0.3 
                        }
                    );
        function drawSnow() {
            ctx.clearRect(
                0,0,canvas.width,canvas.height
            );
            flakes.forEach(
                f => { 
                        ctx.beginPath(); 
                        ctx.arc(f.x,f.y,f.r,0,Math.PI*2); 
                        ctx.fillStyle=`rgba(255,255,255,${f.o})`; 
                        ctx.fill(); 
                        f.x+=f.dx; 
                        f.y+=f.dy; 
                        if(f.y>canvas.height){
                            f.y=-5;
                            f.x=Math.random()*canvas.width;
                        } 
                        if(
                            f.x>canvas.width
                        )
                        f.x=0; 
                        if(f.x<0)
                        f.x=canvas.width; 
                    }
                );
            requestAnimationFrame(drawSnow);
        }
        drawSnow();
    </script>
